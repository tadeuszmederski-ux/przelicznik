<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calkó-lus</title>
<style>
  /* Układ: pasek kategorii (ulubione na początku), pole wejściowe, lista wszystkich jednostek do stuknięcia. */
  :root {
    --bg: #eef2f4;
    --surface: #ffffff;
    --ink: #13222b;
    --muted: #5b6d77;
    --line: #d5dee3;
    --accent: #0b6b72;
    --accent-ink: #ffffff;
    --hot: #fff3d6;
    --hot-line: #e0a526;
    --star: #c47f00;
    --field: #f7fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d171c; --surface: #15242b; --ink: #e6eef1; --muted: #8ea3ad;
      --line: #263b44; --accent: #3fb7bf; --accent-ink: #062226;
      --hot: #2e2710; --hot-line: #c9961f; --star: #f0b93a; --field: #0f1d23;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-block: 12px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .segsel { flex: 1 1 14rem; min-width: 0; font-weight: 600; background: var(--surface); }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: .8rem; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chips button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                  font: inherit; font-size: .92rem; font-weight: 600; padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .chips button .st { color: var(--star); margin-right: 4px; }
  .chips button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chips button[aria-selected="true"] .st { color: inherit; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; }
  .tog { font: inherit; font-size: .85rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .tog[aria-pressed="true"] { border-color: var(--star); background: var(--hot); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .inputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 9.5rem); gap: 10px; }
  .inputs.one { grid-template-columns: minmax(0, 1fr); }
  label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
  input, select {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0;
  }
  input.big { font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }

  ul.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.res li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: stretch; gap: 6px; }
  ul.res li.nostar { grid-template-columns: minmax(0, 1fr) auto; }
  .pick { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 8px; align-items: center; text-align: left;
          font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .pick .u { font-weight: 700; }
  .pick .n { grid-column: 1 / -1; font-size: .72rem; color: var(--muted); margin-top: -2px; }
  .pick .v { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; font-size: 1.05rem; }
  li.src .pick { background: var(--hot); border-color: var(--hot-line); }
  .sq { width: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer;
        font: inherit; font-weight: 700; color: var(--accent); }
  .sq.fav { color: var(--star); }
  .note { color: var(--muted); font-size: .8rem; margin: 0; }
  .note b { color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
           background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .9rem;
           opacity: 0; pointer-events: none; transition: opacity .15s; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  /* Kalkulator */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1 1 0; font: inherit; font-size: .9rem; font-weight: 600; color: var(--ink); background: var(--field);
                border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #kexpr { text-align: right; }
  .kres { display: block; width: 100%; text-align: right; background: transparent; border: 0; color: var(--muted);
          font: inherit; font-size: 1.3rem; font-variant-numeric: tabular-nums; padding: 8px 4px; min-height: 2.6rem;
          overflow-wrap: anywhere; cursor: pointer; }
  .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .keys button { font: inherit; font-size: 1.2rem; font-weight: 600; padding: 13px 0; min-height: 52px; border-radius: 10px;
                 border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .keys button.op { color: var(--accent); }
  .keys button.fn { background: var(--surface); color: var(--muted); }
  .keys button.sci { font-size: .95rem; background: var(--surface); }
  .keys button.eq { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .keys button:active { filter: brightness(.92); }
  .hist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .hist button { width: 100%; text-align: left; font: inherit; font-size: .85rem; color: var(--muted); background: transparent;
                 border: 0; padding: 6px 4px; cursor: pointer; overflow-wrap: anywhere; }
  /* Figury i bryły */
  #shapeWrap, #fgazWrap, #fuelWrap { display: flex; flex-direction: column; gap: 12px; }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 12px; margin-bottom: 0; text-transform: none; letter-spacing: 0;
         font-size: .9rem; color: var(--ink); cursor: pointer; }
  .chk input { width: 22px; height: 22px; padding: 0; flex: 0 0 auto; }
  .h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 0; }
  .fu-list li button .v { font-size: 1rem; }
  .sh-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .sr-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .sr-list li button { width: 100%; text-align: left; display: grid; gap: 2px; font: inherit; color: var(--ink);
                       background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .sr-list .t { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sr-list .v { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .sr-list .s { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .sr-list li.mass button { background: var(--hot); border-color: var(--hot-line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Calkó-lus <span class="sub" id="status"></span></h1>
    <select id="segSel" class="segsel" aria-label="Segment aplikacji">
      <option value="jedn">Jednostki</option>
      <option value="kalk">Kalkulator</option>
      <option value="bryly">Figury i bryły</option>
      <option value="fgaz">F-gazy (CO₂e)</option>
      <option value="paliwa">Paliwa (WO i gęstość)</option>
    </select>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="Kategoria przeliczenia"></div>

  <div class="bar" id="barRow">
    <button type="button" class="tog" id="favCat" aria-pressed="false"></button>
    <button type="button" class="tog" id="onlyFav" aria-pressed="false" hidden>Tylko ulubione jednostki</button>
  </div>

  <section class="card" id="convCard">
    <div class="inputs" id="mainInputs">
      <div>
        <label for="val">Wartość</label>
        <input id="val" class="big" inputmode="decimal" autocomplete="off" placeholder="0">
      </div>
      <div id="unitWrap">
        <label for="unit">Jednostka</label>
        <select id="unit"></select>
      </div>
    </div>
  </section>

  <ul class="res" id="results" aria-live="polite"></ul>

  <section class="card" id="calcBlock" hidden>
    <div class="seg" role="group" aria-label="Rodzaj kalkulatora">
      <button type="button" id="kmZ" aria-pressed="true">Zwykły</button>
      <button type="button" id="kmN" aria-pressed="false">Naukowy</button>
      <button type="button" id="kAngle" hidden>DEG</button>
    </div>
    <input id="kexpr" class="big" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0" aria-label="Wyrażenie">
    <button type="button" class="kres" id="kres" aria-label="Wynik. Stuknij, aby skopiować.">0</button>
    <div class="keys" id="keys"></div>
    <ul class="hist" id="khist" aria-label="Ostatnie obliczenia"></ul>
  </section>
  <div id="shapeWrap" hidden>
    <section class="card">
      <div class="row2" style="margin-top:0">
        <div><label for="shape">Figura lub bryła</label><select id="shape"></select></div>
        <div><label for="dimU">Jednostka wymiarów</label><select id="dimU"></select></div>
      </div>
      <div class="sh-grid" id="shFields"></div>
      <div id="densBox" hidden>
        <div style="height:12px"></div>
        <label for="mat">Materiał (gęstość orientacyjna)</label>
        <select id="mat"></select>
        <div class="row2">
          <div><label for="dens">Gęstość</label><input id="dens" inputmode="decimal" autocomplete="off"></div>
          <div><label for="densU">Jednostka gęstości</label><select id="densU"></select></div>
        </div>
      </div>
    </section>
    <ul class="sr-list" id="shResults" aria-live="polite"></ul>
    <p class="note" id="shNote"></p>
  </div>

  <div id="fgazWrap" hidden>
    <section class="card">
      <label for="fgSet">Zestaw wartości GWP (horyzont 100 lat)</label>
      <select id="fgSet"></select>
      <div style="height:10px"></div>
      <label for="fg">Czynnik chłodniczy lub gaz</label>
      <select id="fg"></select>
      <div id="fgOwnBox" hidden>
        <div style="height:10px"></div>
        <label for="fgOwn">Własny GWP</label>
        <input id="fgOwn" inputmode="decimal" autocomplete="off" placeholder="np. 2088">
      </div>
      <div class="row2">
        <div><label for="fgQ">Ilość czynnika</label><input id="fgQ" class="big" inputmode="decimal" autocomplete="off" placeholder="0"></div>
        <div><label for="fgU">Jednostka</label><select id="fgU"></select></div>
      </div>
      <label class="chk" for="fgHerm"><input type="checkbox" id="fgHerm"> Urządzenie hermetycznie zamknięte</label>
    </section>
    <ul class="sr-list" id="fgRes" aria-live="polite"></ul>
    <p class="note" id="fgNote"></p>
  </div>

  <div id="fuelWrap" hidden>
    <section class="card">
      <label for="fu">Paliwo</label>
      <select id="fu"></select>
      <div class="row2">
        <div><label for="fuQ">Ilość</label><input id="fuQ" class="big" inputmode="decimal" autocomplete="off" placeholder="0"></div>
        <div><label for="fuU">Jednostka</label><select id="fuU"></select></div>
      </div>
      <div class="row2">
        <div><label for="fuWo" id="fuWoL">Wartość opałowa</label><input id="fuWo" inputmode="decimal" autocomplete="off"></div>
        <div><label for="fuRho" id="fuRhoL">Gęstość</label><input id="fuRho" inputmode="decimal" autocomplete="off"></div>
      </div>
      <div style="height:10px"></div>
      <button type="button" class="tog" id="fuReset" hidden>Przywróć wartości domyślne</button>
    </section>
    <ul class="sr-list" id="fuRes" aria-live="polite"></ul>
    <p class="note" id="fuNote"></p>
    <h2 class="h2">Zestawienie paliw (stuknij, aby wybrać)</h2>
    <ul class="sr-list fu-list" id="fuTab"></ul>
  </div>

  <p class="note" id="info"></p>
</main>
<div class="toast" id="toast" role="status"></div>

    { id: "r227ea", n: "R-227ea",        grp: "Czyste HFC", g: [3220, 3350, 3600] },
    { id: "r236fa", n: "R-236fa",        grp: "Czyste HFC", g: [9810, 8060, 8690] },
    { id: "r245fa", n: "R-245fa",        grp: "Czyste HFC", g: [1030, 858, 962] },
    { id: "r365mfc", n: "R-365mfc",      grp: "Czyste HFC", g: [794, 804, 914] },
    { id: "r23",    n: "R-23 (HFC-23)",  grp: "Czyste HFC", g: [14800, 12400, 14600] },
    { id: "r1234yf", n: "R-1234yf (HFO)",     grp: "HFO", g: [4, 1, 0.501] },
    { id: "r1234ze", n: "R-1234ze(E) (HFO)",  grp: "HFO", g: [6, 1, 1.37] },
    { id: "r744",   n: "R-744 (CO₂)",       grp: "Naturalne", g: [1, 1, 1] },
    { id: "r717",   n: "R-717 (amoniak)",   grp: "Naturalne", g: [0, 0, 0] },
    { id: "r290",   n: "R-290 (propan)",    grp: "Naturalne", g: [3, 3, 3] },
    { id: "r600a",  n: "R-600a (izobutan)", grp: "Naturalne", g: [3, 3, 3] },
    { id: "sf6",    n: "SF₆ (sześciofluorek siarki)", grp: "Inne", g: [22800, 23500, 25200] },
    { id: "nf3",    n: "NF₃ (trójfluorek azotu)",     grp: "Inne", g: [17200, 16100, 17400] },
    { id: "r22",    n: "R-22 (HCFC-22)",              grp: "Inne", g: [1810, 1760, 1960] }
  ];
  function fgObj(id) { for (var i = 0; i < FG.length; i++) if (FG[i].id === id) return FG[i]; return null; }
  function fgSetObj(v) { for (var i = 0; i < FG_SETS.length; i++) if (FG_SETS[i].v === v) return FG_SETS[i]; return FG_SETS[0]; }
  function gwpOf(id, i) {
    var g = fgObj(id);
    if (!g) return NaN;
    if (g.mix) { var s = 0; g.mix.forEach(function (c) { s += c[1] * gwpOf(c[0], i); }); return s; }
    return g.g[i];
  }
  function fgRender() {
    var set = fgSetObj(S.fgSet), ul = $("fgRes"), note = $("fgNote");
    ul.innerHTML = "";
    var own = S.fg === "wlasny";
    $("fgOwnBox").hidden = !own;
    var gwp = own ? parse($("fgOwn").value) : gwpOf(S.fg, set.i);
    if (!(isFinite(gwp) && gwp >= 0)) { note.textContent = "Wpisz własny GWP (liczba nie mniejsza od 0)."; return; }
    var q = parse($("fgQ").value), mult = { kg: 1, g: 0.001, t: 1000 }[$("fgU").value] || 1;
    var g = own ? null : fgObj(S.fg);
    var mixTxt = (g && g.mix) ? "Mieszanina: " + g.mix.map(function (c) { return Math.round(c[1] * 1000) / 10 + "% " + fgObj(c[0]).n; }).join(" + ") : "";
    var txt = "GWP dla horyzontu 100 lat. W mieszaninach GWP jest ważony udziałami masowymi składników. W AR5 wartości „<1” (R-1234yf, R-1234ze) przyjęto jako 1. Wartości orientacyjne, do raportów urzędowych sprawdź załączniki do rozporządzenia.";
    if (isFinite(q) && q > 0) {
      var kg = q * mult * gwp, t = kg / 1000;
      addRes(ul, "Ekwiwalent CO₂", fmt(t) + " t CO₂e", fmt(kg) + " kg CO₂e", "mass", raw(t));
      var tier1 = $("fgHerm").checked ? 10 : 5, lk;
      if (t >= 500) lk = "co 3 miesiące, wymagany system wykrywania nieszczelności";
      else if (t >= 50) lk = "co 6 miesięcy";
      else if (t >= tier1) lk = "co 12 miesięcy";
      else lk = "brak obowiązku okresowej kontroli (poniżej " + tier1 + " t CO₂e)";
      addRes(ul, "Kontrola szczelności (jeśli to napełnienie urządzenia)", lk, "Progi: " + tier1 + " / 50 / 500 t CO₂e", "", lk);
      txt += " Progi kontroli szczelności podano orientacyjnie wg rozporządzenia (UE) 2024/573. Szczegóły, np. systemy wykrywania nieszczelności, sprawdź w aktualnym tekście.";
    } else txt = "Wpisz ilość czynnika. " + txt;
    addRes(ul, "GWP (100 lat), " + set.s, fmt(gwp), mixTxt, "", raw(gwp));
    note.textContent = txt;
  }
  function setupFgaz() {
    fillSelect($("fgSet"), FG_SETS.map(function (s) { return { v: s.v, t: s.t }; }), S.fgSet);
    var sel = $("fg"); sel.innerHTML = "";
    ["Mieszaniny", "Czyste HFC", "HFO", "Naturalne", "Inne"].forEach(function (gn) {
      var og = document.createElement("optgroup"); og.label = gn;
      FG.filter(function (x) { return x.grp === gn; }).forEach(function (x) {
        var o = document.createElement("option"); o.value = x.id; o.textContent = x.n; og.appendChild(o);
      });
      sel.appendChild(og);
    });
    var ow = document.createElement("option"); ow.value = "wlasny"; ow.textContent = "Własny GWP"; sel.appendChild(ow);
    if (S.fg !== "wlasny" && !fgObj(S.fg)) S.fg = "r410a";
    sel.value = S.fg;
    fillSelect($("fgU"), [{ v: "kg", t: "kg" }, { v: "g", t: "g" }, { v: "t", t: "t" }], S.fgU);
    $("fgQ").value = S.fgQ; $("fgOwn").value = S.fgOwn; $("fgHerm").checked = !!S.fgHerm;
    fgRender();
  }
  function initFgaz() {
    $("fgSet").addEventListener("change", function () { S.fgSet = $("fgSet").value; save(); fgRender(); });
    $("fg").addEventListener("change", function () { S.fg = $("fg").value; save(); fgRender(); });
    $("fgQ").addEventListener("input", function () { S.fgQ = $("fgQ").value; save(); fgRender(); });
    $("fgU").addEventListener("change", function () { S.fgU = $("fgU").value; save(); fgRender(); });
    $("fgOwn").addEventListener("input", function () { S.fgOwn = $("fgOwn").value; save(); fgRender(); });
    $("fgHerm").addEventListener("change", function () { S.fgHerm = $("fgHerm").checked; save(); fgRender(); });
  }

  // ---- Paliwa: wartość opałowa i gęstość ----------------------------------
  // wo: MJ/kg (ciecze i ciała stałe) albo MJ/m³ n (gazy); rho: kg/m³ (ciecz ok. 15 °C, gaz w war. normalnych, ciało stałe nasypowo).
  var FU = [
    { id: "benz",   k: "c", n: "Benzyna silnikowa",               wo: 44.0, rho: 745 },
    { id: "on",     k: "c", n: "Olej napędowy (ON)",              wo: 43.0, rho: 835 },
    { id: "olop",   k: "c", n: "Olej opałowy lekki",              wo: 42.7, rho: 860 },
    { id: "olc",    k: "c", n: "Olej opałowy ciężki (mazut)",     wo: 40.4, rho: 970 },
    { id: "jet",    k: "c", n: "Paliwo lotnicze Jet A-1",         wo: 44.1, rho: 800 },
    { id: "lpg",    k: "c", n: "LPG (propan-butan)",              wo: 46.0, rho: 540 },
    { id: "etan",   k: "c", n: "Etanol",                          wo: 26.8, rho: 790 },
    { id: "bdies",  k: "c", n: "Biodiesel (FAME)",                wo: 37.0, rho: 880 },
    { id: "gaz",    k: "g", n: "Gaz ziemny (wysokometanowy)",     wo: 35.0, rho: 0.74 },
    { id: "biogaz", k: "g", n: "Biogaz (ok. 60% CH₄)",            wo: 21.5, rho: 1.15 },
    { id: "wodor",  k: "g", n: "Wodór",                           wo: 10.8, rho: 0.0899 },
    { id: "wkam",   k: "s", n: "Węgiel kamienny (energetyczny)",  wo: 23.0, rho: 800 },
    { id: "ekog",   k: "s", n: "Ekogroszek",                      wo: 26.0, rho: 800 },
    { id: "wbru",   k: "s", n: "Węgiel brunatny",                 wo: 9.0,  rho: 750 },
    { id: "koks",   k: "s", n: "Koks",                            wo: 28.2, rho: 450 },
    { id: "drew",   k: "s", n: "Drewno opałowe (powietrznosuche)", wo: 15.0, rho: 400 },
    { id: "pell",   k: "s", n: "Pellet drzewny",                  wo: 17.0, rho: 650 }
  ];
  var FU_KIND = { c: "ciecz", g: "gaz", s: "ciało stałe" };
  function fuObj(id) { for (var i = 0; i < FU.length; i++) if (FU[i].id === id) return FU[i]; return FU[0]; }
  function fuVal(f) {
    var o = (S.fuOv && S.fuOv[f.id]) || {};
    return { wo: o.wo > 0 ? o.wo : f.wo, rho: o.rho > 0 ? o.rho : f.rho };
  }
  function fuWoKg(f, v) { return f.k === "g" ? v.wo / v.rho : v.wo; }   // MJ/kg
  function fuUnits(f) {
    if (f.k === "c") return [{ v: "l", t: "l" }, { v: "m3", t: "m³" }, { v: "kg", t: "kg" }, { v: "t", t: "t" }];
    if (f.k === "g") return [{ v: "m3", t: "m³ n" }, { v: "tm3", t: "tys. m³ n" }, { v: "kg", t: "kg" }];
    return [{ v: "kg", t: "kg" }, { v: "t", t: "t" }, { v: "m3", t: "m³ (nasypowo)" }];
  }
  function fuDesc(f, v) {
    var woKg = fuWoKg(f, v), p = [];
    if (f.k === "g") p.push(fmt(v.wo) + " MJ/m³ n", fmt(v.wo / 3.6) + " kWh/m³ n", fmt(woKg) + " MJ/kg", fmt(v.rho) + " kg/m³ n");
    else if (f.k === "c") p.push(fmt(woKg) + " MJ/kg", fmt(woKg / 3.6) + " kWh/kg", fmt(woKg * v.rho / 1000) + " MJ/l", fmt(v.rho) + " kg/m³");
    else p.push(fmt(woKg) + " MJ/kg", fmt(woKg / 3.6) + " kWh/kg", fmt(v.rho) + " kg/m³ (nasypowo)");
    return p.join("  ·  ");
  }
  function fuFields() {
    var f = fuObj(S.fu), v = fuVal(f), units = fuUnits(f);
    if (!units.some(function (u) { return u.v === S.fuU; })) S.fuU = units[0].v;
    fillSelect($("fuU"), units, S.fuU);
    $("fuQ").value = S.fuQ;
    $("fuWoL").textContent = "Wartość opałowa [" + (f.k === "g" ? "MJ/m³ n" : "MJ/kg") + "]";
    $("fuRhoL").textContent = (f.k === "s" ? "Gęstość nasypowa" : "Gęstość") + " [kg/m³" + (f.k === "g" ? " n" : "") + "]";
    $("fuWo").value = raw(v.wo); $("fuRho").value = raw(v.rho);
    $("fuReset").hidden = !(S.fuOv && S.fuOv[f.id]);
  }
  function fuRender() {
    var f = fuObj(S.fu), v = fuVal(f), ul = $("fuRes"); ul.innerHTML = "";
    var woKg = fuWoKg(f, v), q = parse($("fuQ").value);
    var note = FU_KIND[f.k] + ". " + fuDesc(f, v) + ". Wartości orientacyjne: do rozliczeń wpisz dane z faktury dostawcy, świadectwa jakości lub wskaźniki KOBiZE."
      + (f.k === "g" ? " Objętość gazu w warunkach normalnych (0 °C, 101,325 kPa)." : "");
    if (!(isFinite(q) && q > 0)) { $("fuNote").textContent = "Wpisz ilość paliwa. " + note; return; }
    var mult = { kg: 1, t: 1000, l: v.rho / 1000, m3: v.rho, tm3: v.rho * 1000 }[$("fuU").value] || 1;
    var mass = q * mult, vol = mass / v.rho, mj = mass * woKg;
    addRes(ul, "Energia (wartość opałowa)", fmt(mj / 1000) + " GJ",
      [fmt(mj) + " MJ", fmt(mj / 3.6) + " kWh", fmt(mj / 3600) + " MWh", fmt(mj / 41868) + " toe", fmt(mj / 29307.6) + " tce"].join("  ·  "), "mass", raw(mj / 1000));
    addRes(ul, "Masa", fmt(mass) + " kg", fmt(mass / 1000) + " t", "", raw(mass));
    if (f.k === "c") addRes(ul, "Objętość", fmt(vol * 1000) + " l", fmt(vol) + " m³", "", raw(vol * 1000));
    else if (f.k === "g") addRes(ul, "Objętość", fmt(vol) + " m³ n", fmt(vol / 1000) + " tys. m³ n", "", raw(vol));
    else addRes(ul, "Objętość (nasypowo)", fmt(vol) + " m³", fmt(vol * 1000) + " l", "", raw(vol));
    $("fuNote").textContent = note;
  }
  function fuTable() {
    var ul = $("fuTab"); ul.innerHTML = "";
    FU.forEach(function (f) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; if (f.id === S.fu) li.className = "mass";
      b.innerHTML = '<span class="t"></span><span class="v"></span><span class="s"></span>';
      b.children[0].textContent = FU_KIND[f.k]; b.children[1].textContent = f.n; b.children[2].textContent = fuDesc(f, fuVal(f));
      b.addEventListener("click", function () {
        S.fu = f.id; save(); $("fu").value = f.id; fuFields(); fuRender(); fuTable();
        try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
      });
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function setupFuels() {
    S.fu = fuObj(S.fu).id;
    fillSelect($("fu"), FU.map(function (f) { return { v: f.id, t: f.n }; }), S.fu);
    fuFields(); fuRender(); fuTable();
  }
  function fuSetOv(key, input) {
    var x = parse($(input).value);
    if (isFinite(x) && x > 0) {
      if (!S.fuOv || typeof S.fuOv !== "object") S.fuOv = {};
      var o = S.fuOv[S.fu] || (S.fuOv[S.fu] = {});
      o[key] = x; save(); $("fuReset").hidden = false;
    }
    fuRender(); fuTable();
  }
  function initFuels() {
    $("fu").addEventListener("change", function () { S.fu = $("fu").value; save(); fuFields(); fuRender(); fuTable(); });
    $("fuQ").addEventListener("input", function () { S.fuQ = $("fuQ").value; save(); fuRender(); });
    $("fuU").addEventListener("change", function () { S.fuU = $("fuU").value; save(); fuRender(); });
    $("fuWo").addEventListener("input", function () { fuSetOv("wo", "fuWo"); });
    $("fuRho").addEventListener("input", function () { fuSetOv("rho", "fuRho"); });
    $("fuReset").addEventListener("click", function () {
      if (S.fuOv) delete S.fuOv[S.fu];
      save(); fuFields(); fuRender(); fuTable();
    });
  }

  // ---- Zdarzenia -----------------------------------------------------------
  $("favCat").addEventListener("click", function () {
    S.favCats = toggle(S.favCats, S.tab); save(); setupTab();
  });
  $("onlyFav").addEventListener("click", function () {
    S.onlyFav[S.tab] = !S.onlyFav[S.tab]; save(); updateOnlyFavBtn(); render();
  });
  $("val").addEventListener("input", function () {
    var c = cat(S.tab);
    S.val[c.id] = $("val").value;
    save(); render();
  });
  $("unit").addEventListener("change", function () { S.unit[S.tab] = $("unit").value; save(); render(); });
  // Lista rozwijana segmentów: Jednostki / Kalkulator / Bryły / F-gazy / Paliwa.
  $("segSel").addEventListener("change", function () {
    var v = $("segSel").value;
    if (v === "jedn") {
      var t = cat(S.lastTab);
      S.tab = (t.id === S.lastTab && !t.w) ? t.id : "energia";
    } else S.tab = v;
    save(); setupTab(); render();
  });

  // ---- Start ---------------------------------------------------------------
  load(); initCalc(); initShapes(); initFgaz(); initFuels(); setupTab(); render();

  var online = function () { $("status").textContent = navigator.onLine ? "" : "tryb offline"; };
  window.addEventListener("online", online); window.addEventListener("offline", online); online();

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
