<title>Inwentaryzacja energetyczna</title>
<style>
:root{--tlo:#fff;--tekst:#000;--glowny:#0b3d91;--glowny2:#062a66;--ramka:#555;--wym:#d35400;--brak:#ffe3e8;--ok:#0a7a2f;--szary:#e9e9e9;--ostrz:#b00020}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--tlo);color:var(--tekst);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body.modal-otwarty{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--glowny);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:#fff;color:var(--glowny);min-height:44px;min-width:44px;border:0;border-radius:8px;font-weight:700;font-size:17px}
#stan-zapisu{font-size:13px;opacity:.95;white-space:nowrap}
main{padding:10px 12px 90px;max-width:900px;margin:0 auto}
footer{font-size:13px;color:#333;text-align:center;padding:12px 12px 40px;border-top:1px solid #ccc;max-width:900px;margin:0 auto}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:2px solid var(--glowny);border-radius:10px;background:var(--glowny);color:#fff;font-weight:700;font-size:18px;text-align:left}
.btn.jasny{background:#fff;color:var(--glowny)}
.btn.ostrz{background:#fff;color:var(--ostrz);border-color:var(--ostrz)}
.btn.maly{display:inline-block;width:auto;min-height:44px;margin:4px 4px 4px 0;font-size:16px;text-align:center}
.btn small{display:block;font-weight:400;font-size:14px;opacity:.9}
.kafel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.znacz{font-size:14px;font-weight:700;border-radius:12px;padding:2px 8px;background:#fff;color:var(--ok);border:2px solid var(--ok);white-space:nowrap}
.znacz.brakuje{color:var(--wym);border-color:var(--wym)}
h2{font-size:21px;margin:14px 0 6px}
h3{font-size:19px;margin:10px 0 4px}
.opis{background:#f3f6fb;border-left:5px solid var(--glowny);padding:8px 10px;margin:6px 0 10px;font-size:16px}
.pole{margin:8px 0 12px;padding-left:8px;border-left:5px solid transparent}
.pole.wym{border-left-color:var(--wym)}
.pole.sug{border-left-color:#7fa7e6}
.sugt{font-weight:400;font-size:13px;color:#1f5fbf;border:1px solid #7fa7e6;border-radius:8px;padding:0 6px}
details.wiecej{margin:8px 0 12px;border:2px dashed #999;border-radius:10px;padding:4px 8px}
details.wiecej>summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--glowny);cursor:pointer}
.powrot{background:#e8f0ff;border:2px solid var(--glowny);border-radius:10px;padding:8px;margin:8px 0}
#sz-pasek{position:sticky;top:56px;z-index:4;background:#111;color:#ffde00;font-size:22px;font-weight:800;padding:6px 10px;border-radius:8px;min-height:44px}
.pole label{display:block;font-weight:600;font-size:16px;margin-bottom:3px}
.pole.wym label{font-weight:800}
.j{font-weight:400;color:#333}
.gw{color:var(--wym)}
.wiersz-pola{display:flex;gap:6px;align-items:stretch;position:relative}
input,select,textarea{font:inherit;font-size:18px;width:100%;min-height:48px;padding:8px 10px;border:2px solid var(--ramka);border-radius:8px;background:#fff;color:#000}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:3px solid #ffbf00;outline-offset:1px}
.pole.brak input,.pole.brak select,.pole.brak textarea{background:var(--brak)}
.pyt{min-width:48px;border:2px solid var(--glowny);background:#fff;color:var(--glowny);border-radius:8px;font-weight:800;font-size:20px}
.pomoc{background:#fffbe6;border:1px solid #d8c36a;border-radius:8px;padding:8px;margin-top:4px;font-size:15px}
.karta{border:2px solid #999;border-radius:12px;padding:8px 10px;margin:10px 0;background:#fafafa}
.karta>.tyt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:18px}
.karta .pod{border-top:1px dashed #999;margin-top:6px;padding-top:6px}
.wyl{font-weight:700;background:#eef7ee;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:16px}
.auto-lista{position:absolute;left:0;right:54px;top:100%;z-index:20;background:#fff;border:2px solid var(--glowny);border-radius:8px;max-height:300px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.auto-lista div{padding:10px;border-bottom:1px solid #ddd;font-size:16px}
.auto-lista div small{color:#444}
.auto-lista div:active{background:#dde7f7}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.okno-modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.okno-modal h2{margin-top:2px}
.przyciski-modal{display:flex;flex-wrap:wrap;gap:6px;position:sticky;bottom:0;background:#fff;padding-top:6px}
.przyciski-modal button{flex:1 1 40%;min-height:52px;border-radius:10px;border:2px solid var(--glowny);background:#fff;color:var(--glowny);font-weight:700;font-size:17px}
.przyciski-modal button.gl{background:var(--glowny);color:#fff}
.przyciski-modal button.us{color:var(--ostrz);border-color:var(--ostrz)}
.info{font-weight:700;margin:6px 0;white-space:pre-line}
.multi label{display:flex;align-items:center;gap:8px;font-weight:400;min-height:44px}
.multi input{width:28px;min-height:28px}
.siatka-zdj{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.siatka-zdj figure{margin:0;border:2px solid #999;border-radius:8px;overflow:hidden;background:#eee}
.siatka-zdj img{width:100%;height:120px;object-fit:cover;display:block}
.siatka-zdj figcaption{font-size:14px;padding:4px 6px;background:#fff}
.lista-k{list-style:none;padding:0;margin:0}
.lista-k li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ddd}
.lista-k input{width:30px;min-height:30px}
.lista-k .ile{margin-left:auto;font-size:14px}
.ostrzezenie{background:#fff0f0;border:2px solid var(--ostrz);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px}
#pasek-trwalosci{background:var(--ostrz);color:#fff;padding:8px 12px;font-weight:700}
.narz{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.narz button{min-height:46px;min-width:46px;padding:4px 10px;border:2px solid var(--glowny);border-radius:8px;background:#fff;color:var(--glowny);font-weight:700;font-size:16px}
.narz button.akt{background:var(--glowny);color:#fff}
#plotno-szkicu{width:100%;height:62vh;border:2px solid #333;border-radius:8px;touch-action:none;background:#fff;display:block}
#przegladarka{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#przegladarka[hidden]{display:none}
#przegladarka .gora,#przegladarka .dol{background:#111;color:#fff;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#przegladarka .gora{padding-top:max(6px,env(safe-area-inset-top))}
#przegladarka .dol{padding-bottom:max(6px,env(safe-area-inset-bottom))}
#przegladarka button{min-height:50px;min-width:50px;padding:4px 10px;border:2px solid #fff;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:16px}
#przegladarka button.akt{background:#ffbf00;color:#000;border-color:#ffbf00}
#przegladarka .tyt{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plotno-zdj{flex:1;width:100%;touch-action:none;display:block}
#podpowiedz-zdj{color:#ffbf00;font-size:15px;width:100%}
table.tab{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
table.tab td,table.tab th{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
.ukryty{display:none!important}
</style>
</head>

          if (!d.objectStoreNames.contains('ustawienia')) d.createObjectStore('ustawienia', {keyPath: 'id'});
        };

    });
  },
  async wszystkie(st) { return this.db ? this._tx(st, 'readonly', s => s.getAll()) : Array.from(this.pam[st].values()); },

/* ===================================================================== geometria wspólna */
const SEKTORY = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

function podlaczAuto(kontener) {
  $$('input.auto', kontener).forEach(inp => {
    if (inp.dataset.auto) return; inp.dataset.auto = '1';
    const pokaz = () => {
      zamknijAuto(); const q = norm(inp.value).split(/\s+/).filter(Boolean);
      const poz = pozycjeAuto(inp.dataset.l, S.P || {tabele: {przegrody: [], sciany: [], nieogrzewane: []}}, wierszSc(inp.dataset.sc));
      let traf = poz.filter(o => { const n = norm(o.et); return q.every(s => n.includes(s)); }).slice(0, 40);
      if (inp.dataset.l === '@symbol') traf = poz;           // propozycje symboli – zawsze cała lista
      if (!traf.length) return;
      const d = document.createElement('div'); d.className = 'auto-lista';
      d.innerHTML = traf.map((o, i) => `<div data-i="${i}">${esc(o.et)}${o.op ? `<br><small>${esc(o.op)}</small>` : ''}</div>`).join('');
      d.addEventListener('pointerdown', e => { const el = e.target.closest('[data-i]'); if (!el) return; e.preventDefault(); inp.value = traf[+el.dataset.i].v; zamknijAuto(); inp.dispatchEvent(new Event('input', {bubbles: true})); inp.dispatchEvent(new Event('change', {bubbles: true})); });

  return `<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"><title>Raport z inwentaryzacji – ${esc(P.nazwa)}</title>
